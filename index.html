<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <main class="container">

        <!-- Nabvar -->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">AutoRent Express</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Gestión de reservas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="clientes.html">Gestión de clientes</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Formulario -->
        <section class="mt-3 text-center">
            <form id="frmAgregarReservas"> <!-- frmAgregarReservas -->
                <fieldset>
                    <legend class="text-center fw-bold mb-4">Gestión de reservas</legend>
                    <input id="idReserva" hidden> <!-- idReserva-->
                    <div class="mb-3"> <!-- ddNombreCliente-->
                        <label for="ddNombreCliente" class="form-label">Cliente:</label>
                        <select id="ddNombreCliente" class="form-select">
                            <option value="">Selecciona un cliente</option>
                        </select>
                    </div>
                    <div class="mb-3"> <!-- ddVehiculo-->
                        <label for="ddVehiculo" class="form-label">Vehículo:</label>
                        <select id="ddVehiculo" class="form-select">
                            <option value="">Selecciona un vehículo</option>
                        </select>
                    </div>
                    <!-- Prof. Ricardo me dijo que el nombre de la reserva es el mismo que el nombre de la persona por eso no puse la reserva -->
                    <div class="mb-3"><!-- txtFechaReserva -->
                        <label for="txtFechaReserva" class="form-label">Fecha de reserva:</label>
                        <input type="date" id="txtFechaReserva" class="form-control" placeholder="ej. Pérez Vásquez"
                            required>
                    </div>
                    <div class="mb-3"><!-- txtCantidadPasajeros -->
                        <label for="txtCantidadPasajeros" class="form-label">Cantidad de pasajeros:</label>
                        <input type="number" id="txtCantidadPasajeros" class="form-control" required min="1">
                    </div>
                    <div class="mb-3"><!-- txtCantidadDias -->
                        <label for="txtCantidadDias" class="form-label">Cantidad de días:</label>
                        <input type="number" id="txtCantidadDias" class="form-control"  min="0">
                    </div>
                    <div class="mb-3"><!-- txtTotalPago -->
                        <label for="txtTotalPago" class="form-label">Total a pagar:</label>
                        <input type="number" id="txtTotalPago" class="form-control" disabled>
                    </div>
                    <div class="mb-3"><!-- ddEstadoeserva -->
                        <label for="ddEstadoReserva" class="form-label">Estado de la reserva:</label>
                        <select id="ddEstadoReserva" class="form-select" disabled>
                            <option value="CONFIRMADA">Confirmada</option>
                        </select>
                    </div>
                    <div class="alert d-none" id="mensaje" role="alert"> <!-- mensaje -->
                        <p id="textoMensaje"></p> <!-- Aqui se mostrara el mensaje textoMensaje-->
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnAgregarReserva">Agregar reserva</button>
                    <!-- btnAgregarReserva-->
                    <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
                    <!-- btnCancelar -->
                </fieldset>
            </form>
        </section>

        <!-- Tabla -->
        <section class="mt-4">
            <legend class="text-center fw-bold mb-4">Todas las reservas</legend>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">id</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Vehículo</th>
                        <th scope="col">Fecha de reserva</th>
                        <th scope="col">Cantidad de pasajeros</th>
                        <th scope="col">Cantidad de días</th>
                        <th scope="col">Total a pagar</th>
                        <th scope="col">Estado actual</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbReservas"> <!-- tbReservas-->
                </tbody>
            </table>
        </section>

    </main>

    <!-- JavaScript de Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Controller propio -->
    <script type="module" src="js/controllers/indexController.js"></script>
</body>

</html>
