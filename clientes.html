<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <main class="container">

        <!-- Nabvar -->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">AutoRent Express</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link " aria-current="page" href="index.html">Gestión de reservas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="clientes.html">Gestión de clientes</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Formulario -->
        <section class="mt-3 text-center">
            <form id="frmAgregarClientes">
                <fieldset>
                    <legend class="text-center fw-bold mb-4">Gestión de clientes</legend>
                    <input id="idCliente" hidden> <!-- idCliente-->
                    <div class="mb-3"><!-- txtNombre -->
                        <label for="txtNombre" class="form-label">Nombre:</label>
                        <input type="text" id="txtNombre" class="form-control" placeholder="ej. Daniel Orlando"
                            required>
                    </div>
                    <div class="mb-3"><!-- txtApellido -->
                        <label for="txtApellido" class="form-label">Apellido:</label>
                        <input type="text" id="txtApellido" class="form-control" placeholder="ej. Pérez Vásquez"
                            required>
                    </div>
                    <div class="mb-3"><!-- txtTelefono -->
                        <label for="txtTelefono" class="form-label">Teléfono:</label>
                        <input type="text" id="txtTelefono" class="form-control" placeholder="ej. 15235478" required maxlength="8">
                    </div>
                    <div class="mb-3"><!-- txtEmail -->
                        <label for="txtEmail" class="form-label">Email:</label>
                        <input type="email" id="txtEmail" class="form-control" placeholder="ej. example@gmail.com" required>
                    </div>
                    <div class="mb-3"> <!-- txtDirecion -->
                        <label for="txtDireccion" class="form-label">Dirección:</label>
                        <input type="text" id="txtDireccion" class="form-control" placeholder="ej. Calle osito (opcional)">
                    </div>
                    <div class="alert d-none" id="mensaje" role="alert"> <!-- mensaje -->
                        <p id="textoMensaje"></p> <!-- Aqui se mostrara el mensaje textoMensaje-->
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnAgregarCliente">Agregar cliente</button>
                    <!-- btnAgregarCliente-->
                    <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
                    <!-- btnCancelar -->
                </fieldset>
            </form>
        </section>

        <!-- Tabla -->
        <section class="mt-4">
            <legend class="text-center fw-bold mb-4">Todos los clientes</legend>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">id</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellido</th>
                        <th scope="col">Teléfono</th>
                        <th scope="col">Email</th>
                        <th scope="col">Dirección</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbClientes"> <!-- tbClientes-->
                </tbody>
            </table>
        </section>

    </main>

    <!-- JavaScript de Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Controller propio -->
    <script type="module" src="js/controllers/clientesController.js"></script>
</body>

</html>
